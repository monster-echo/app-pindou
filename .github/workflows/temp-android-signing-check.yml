name: Temporary Android signing check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate configured Android signing secrets without revealing them
        env:
          KEYSTORE_B64: ${{ secrets.FLUTTER_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.FLUTTER_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.FLUTTER_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FLUTTER_KEY_ALIAS }}
        run: |
          set -euo pipefail
          umask 077
          OUTCOME="$RUNNER_TEMP/signing-check.txt"
          KEYSTORE="$RUNNER_TEMP/pindou-check.jks"
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "Secret presence check: one or more values are empty."
            echo "Secret presence check: one or more values are empty." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE" 2>/dev/null; then
            echo "Keystore decoding: failed."
            echo "Keystore decoding: failed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat > "$RUNNER_TEMP/SigningCheck.java" <<'JAVA'
          import java.io.FileInputStream;
          import java.security.KeyStore;
          import java.security.MessageDigest;
          import java.security.PrivateKey;
          import java.security.cert.Certificate;
          import java.util.HexFormat;
          public class SigningCheck {
            public static void main(String[] args) {
              String result = "STORE_PASSWORD_VALID=false";
              String fingerprint = "";
              try {
                char[] storePass = System.getenv("STORE_PASSWORD").toCharArray();
                char[] keyPass = System.getenv("KEY_PASSWORD").toCharArray();
                KeyStore store = KeyStore.getInstance("JKS");
                try (FileInputStream in = new FileInputStream(args[0])) { store.load(in, storePass); }
                result = "STORE_PASSWORD_VALID=true";
                String alias = System.getenv("KEY_ALIAS");
                if (!store.isKeyEntry(alias)) {
                  result += "\nALIAS_VALID=false";
                } else {
                  result += "\nALIAS_VALID=true";
                  try {
                    PrivateKey key = (PrivateKey) store.getKey(alias, keyPass);
                    result += "\nKEY_PASSWORD_VALID=" + (key != null);
                    Certificate cert = store.getCertificate(alias);
                    fingerprint = "\nCERT_SHA256=" + HexFormat.of().withUpperCase().formatHex(
                      MessageDigest.getInstance("SHA-256").digest(cert.getEncoded()));
                  } catch (Exception e) { result += "\nKEY_PASSWORD_VALID=false"; }
                }
              } catch (Exception e) { }
              System.out.println(result + fingerprint);
            }
          }
          JAVA
          javac -d "$RUNNER_TEMP" "$RUNNER_TEMP/SigningCheck.java" >/dev/null 2>&1
          java -cp "$RUNNER_TEMP" SigningCheck "$KEYSTORE" | tee "$OUTCOME"
          cat "$OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          rm -f "$KEYSTORE" "$RUNNER_TEMP/SigningCheck.java" "$RUNNER_TEMP/SigningCheck.class" "$OUTCOME"
